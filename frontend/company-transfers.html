<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTC4 — Company Transfers</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f3f5; --sidebar:#182335; --sidebar-hover:#22304a; --panel:#ffffff; --line:#dde1e6;
    --text:#191c22; --text-dim:#6b7280; --primary:#2563a8; --primary-bg:#e5eef7;
    --success:#1f8a5f; --success-bg:#e4f3ec; --warning:#b7791f; --warning-bg:#faf1e0;
    --danger:#c0392b; --danger-bg:#fbe9e7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;display:flex;min-height:100vh;}
  [dir="ltr"] body{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',sans-serif;}

  .sidebar{width:216px;background:var(--sidebar);color:#cdd4e0;flex-shrink:0;padding:18px 0;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .sb-brand-mark{width:28px;height:28px;border-radius:5px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
  .sb-brand-text{font-size:13.5px;font-weight:600;color:#fff;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:12.5px;color:#b9c1d1;cursor:pointer;border-inline-end:2px solid transparent;text-decoration:none;}
  .sb-item.active{background:var(--sidebar-hover);color:#fff;border-inline-end:2px solid var(--primary);}

  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;}
  .lang-toggle span{padding:6px 12px;font-size:12px;}
  .lang-toggle span.active{background:var(--primary);color:#fff;}
  .btn-logout{font-family:inherit;font-size:12px;border-radius:4px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .btn-logout:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}

  .content{padding:20px 24px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .page-title{font-size:16px;font-weight:600;}
  .btn{font-family:inherit;font-size:12px;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .btn.small{padding:5px 10px;font-size:11.5px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .card-title{padding:12px 16px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);background:#f7f8f9;display:flex;justify-content:space-between;align-items:center;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:start;font-weight:600;color:var(--text-dim);font-size:11px;padding:9px 14px;border-bottom:1px solid var(--line);background:#f7f8f9;white-space:nowrap;}
  tbody td{padding:9px 14px;border-bottom:1px solid var(--line);}
  tbody tr:nth-child(even){background:#fafbfc;}
  .amount{font-family:'IBM Plex Mono',monospace;direction:ltr;display:block;text-align:end;}
  .loading,.empty{padding:40px;text-align:center;color:var(--text-dim);}
  .notice{display:none;padding:9px 12px;border-radius:4px;font-size:12px;margin-bottom:14px;}
  .notice.show{display:block;}
  .notice.error{background:var(--danger-bg);color:var(--danger);}
  .notice.ok{background:var(--success-bg);color:var(--success);}

  .form-panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:18px;}
  .form-panel.show{display:block;}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;}
  .group-row{display:grid;grid-template-columns:1fr 90px 110px 110px 34px;gap:10px;margin-bottom:8px;align-items:center;}
  .group-row input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;}
  .row-remove{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:4px;background:var(--danger-bg);color:var(--danger);cursor:pointer;height:30px;}
  .alloc-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;padding:0 16px 16px;}
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-mark">FT</div>
      <div class="sb-brand-text">FTC4</div>
    </div>
    <a class="sb-item" href="/index.html" data-i18n="nav.clients">العملاء</a>
    <a class="sb-item" href="/vault.html" data-i18n="nav.vault">الخزينة</a>
    <a class="sb-item" href="/bagstock.html" data-i18n="bagstock.title">مخزون الحقائب</a>
    <a class="sb-item" href="/invoices.html" data-i18n="invoices.title">سجل الفواتير</a>
    <a class="sb-item" href="/purchases.html" data-i18n="purchases.title">المشتريات</a>
    <a class="sb-item" href="/manual-sales.html" data-i18n="nav.manualSales">المبيعات اليدوية</a>
    <a class="sb-item active" href="/company-transfers.html" data-i18n="nav.companyTransfers">حوالات الشركات</a>
    <a class="sb-item" href="/reports.html" data-i18n="nav.reports">التقارير</a>
    <a class="sb-item" href="/ledger.html" data-i18n="nav.ledger">الحسابات والقيود</a>
    <a class="sb-item" href="/users.html" data-i18n="nav.users">المستخدمون</a>
    <a class="sb-item" href="/settings.html" data-i18n="nav.settings">الإعدادات</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div data-i18n="ct.title">حوالات الشركات</div>
      <div class="topbar-left">
        <div class="lang-toggle" id="lang-toggle"><span data-lang="ar">عربي</span><span data-lang="en">EN</span></div>
        <button class="btn-logout" id="logout-btn" data-i18n="auth.logout">تسجيل الخروج</button>
      </div>
    </div>

    <div class="content">
      <div class="page-head">
        <div class="page-title" data-i18n="ct.title">حوالات الشركات</div>
        <button class="btn primary" id="new-transfer-btn" data-i18n="ct.new">حوالة جديدة</button>
      </div>

      <div class="notice" id="notice"></div>

      <div class="form-panel" id="form-panel">
        <div class="form-row">
          <div class="field"><label data-i18n="ct.company">الشركة</label><select id="f-company"></select></div>
          <div class="field"><label data-i18n="ct.date">تاريخ الحوالة</label><input type="date" id="f-date"></div>
          <div class="field"><label data-i18n="ct.destination">وجهة الدفع</label>
            <select id="f-dest">
              <option value="vault" data-i18n="vault.destination.vault">الكاش</option>
              <option value="bank" data-i18n="vault.destination.bank">البنك</option>
              <option value="network" data-i18n="vault.destination.network">الشبكة</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-bottom:12px"><label data-i18n="ct.groups">مجموعات الفئات</label></div>
        <div class="group-row">
          <span>التصنيف</span><span>العدد</span><span>سعر الدورة</span><span>سعر الحقيبة</span><span></span>
        </div>
        <div id="groups"></div>
        <button class="btn" id="add-group-btn" data-i18n="ct.addGroup">أضف مجموعة</button>
        <button class="btn primary" id="save-transfer-btn" data-i18n="actions.save" style="margin-inline-start:8px">حفظ</button>
        <button class="btn" id="cancel-btn" data-i18n="actions.cancel">إلغاء</button>
      </div>

      <div id="output"></div>
    </div>
  </div>

<script>
let i18n = {};
let currentLang = localStorage.getItem('ftc4_lang') || 'ar';
let companies = [];
let selectedTransferId = null;

const token = localStorage.getItem('ftc4_token');
if (!token) location.replace('/login.html');

async function ftc4Fetch(url, opts = {}) {
  const headers = new Headers(opts.headers || {});
  headers.set('Authorization', 'Bearer ' + token);
  if (opts.body) headers.set('Content-Type', 'application/json');
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401) { localStorage.removeItem('ftc4_token'); localStorage.removeItem('ftc4_user'); location.replace('/login.html'); return null; }
  return res;
}

async function loadI18n(lang) { const r = await fetch(`/i18n/${lang}.json`); i18n = await r.json(); }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (i18n[k]) el.textContent = i18n[k]; });
  document.getElementById('html-root').setAttribute('lang', currentLang);
  document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('#lang-toggle span').forEach(s => s.classList.toggle('active', s.dataset.lang === currentLang));
}
function t(key) { return i18n[key] || key; }
function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2 }); }
function money(n) { return `<span class="amount">${fmt(n)}</span>`; }

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('ftc4_token'); localStorage.removeItem('ftc4_user'); location.replace('/login.html');
});
document.getElementById('lang-toggle').addEventListener('click', async (e) => {
  const lang = e.target.dataset.lang;
  if (!lang || lang === currentLang) return;
  currentLang = lang; localStorage.setItem('ftc4_lang', lang);
  await loadI18n(lang); applyI18n(); loadTransfers();
});

function showNotice(msg, ok) {
  const el = document.getElementById('notice');
  el.textContent = msg;
  el.className = 'notice show ' + (ok ? 'ok' : 'error');
  setTimeout(() => el.classList.remove('show'), 4000);
}

async function loadTransfers() {
  const out = document.getElementById('output');
  out.innerHTML = `<div class="loading">...</div>`;
  try {
    const res = await ftc4Fetch('/api/company-transfers?pageSize=50');
    if (!res) return;
    const { data } = await res.json();
    if (!data.length) { out.innerHTML = `<div class="empty">—</div>`; return; }
    out.innerHTML = `
      <div class="card"><table>
        <thead><tr>
          <th data-i18n="ct.company">الشركة</th><th data-i18n="ct.date">تاريخ الحوالة</th>
          <th data-i18n="ct.traineeCount">عدد المتدربين</th><th data-i18n="ct.allocatedTotal">المبلغ المخصص</th><th></th>
        </tr></thead>
        <tbody>
          ${data.map(c => `<tr>
            <td>${c.company_name}</td>
            <td>${c.transfer_date}</td>
            <td>${c.trainee_count}</td>
            <td>${money(c.allocated_total)}</td>
            <td><button class="btn small primary" data-view="${c.id}">${t('ct.detail')}</button></td>
          </tr>`).join('')}
        </tbody>
      </table></div>`;
    out.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => showDetail(b.dataset.view)));
  } catch (err) {
    out.innerHTML = `<div class="empty">${err.message}</div>`;
  }
}

async function showDetail(id) {
  selectedTransferId = id;
  const out = document.getElementById('output');
  out.innerHTML = `<div class="loading">...</div>`;
  try {
    const res = await ftc4Fetch('/api/company-transfers/' + id);
    if (!res) return;
    const tr = await res.json();
    const groupsRows = tr.groups.map(g => `<tr><td>${g.classification}</td><td>${g.trainee_count}</td><td>${money(g.course_price)}</td><td>${money(g.bag_price)}</td></tr>`).join('');
    const clientsRows = tr.clients.map(c => `<tr><td>${c.name}</td><td>${c.course_type || '—'}</td><td>${money(c.course_price)}</td><td>${money(c.bag_price)}</td></tr>`).join('')
      || `<tr><td colspan="4" class="empty">${t('ct.noClients')}</td></tr>`;
    const groupsForSelect = tr.groups.map(g => `<option value="${g.classification}">${g.classification}</option>`).join('');
    const clients = await (await ftc4Fetch('/api/clients?pageSize=200')).json();
    const clientOptions = clients.data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

    out.innerHTML = `
      <div class="card">
        <div class="card-title"><span>${tr.company_name} — ${tr.transfer_date}</span>
          <span>${t('ct.allocatedTotal')}: ${fmt(tr.allocated_total)}</span></div>
        <table><thead><tr><th data-i18n="ct.classification">التصنيف</th><th data-i18n="ct.traineeCount">العدد</th><th data-i18n="ct.coursePrice">سعر الدورة</th><th data-i18n="ct.bagPrice">سعر الحقيبة</th></tr></thead>
        <tbody>${groupsRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-title"><span>${t('ct.allocatedClients')}</span>
          <button class="btn small" id="sync-btn">${t('ct.sync')}</button></div>
        <table><thead><tr><th data-i18n="ct.client">العميل</th><th data-i18n="ct.classification">التصنيف</th><th data-i18n="ct.coursePrice">سعر الدورة</th><th data-i18n="ct.bagPrice">سعر الحقيبة</th></tr></thead>
        <tbody>${clientsRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-title">${t('ct.allocate')}</div>
        <div class="alloc-form">
          <div class="field"><label data-i18n="ct.client">العميل</label><select id="alloc-client">${clientOptions}</select></div>
          <div class="field"><label data-i18n="ct.classification">التصنيف</label><select id="alloc-class">${groupsForSelect}</select></div>
          <div class="field"><label>bag_source</label><select id="alloc-bag"><option value="stock">stock</option><option value="own">own</option><option value="buy">buy</option></select></div>
          <button class="btn primary" id="alloc-btn">${t('ct.allocate')}</button>
        </div>
      </div>
      <button class="btn" id="back-btn">← ${t('ct.title')}</button>`;

    document.getElementById('back-btn').addEventListener('click', () => { selectedTransferId = null; loadTransfers(); });
    document.getElementById('sync-btn').addEventListener('click', async () => {
      await ftc4Fetch(`/api/company-transfers/${id}/resync`, { method: 'POST' });
      showNotice('تمت المزامنة', true); showDetail(id);
    });
    document.getElementById('alloc-btn').addEventListener('click', async () => {
      const res = await ftc4Fetch(`/api/company-transfers/${id}/allocate-clients`, {
        method: 'POST',
        body: JSON.stringify({ allocations: [{
          client_id: document.getElementById('alloc-client').value,
          classification: document.getElementById('alloc-class').value,
          bag_source: document.getElementById('alloc-bag').value,
        }] }),
      });
      if (!res) return;
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      showNotice('تم ربط العميل', true); showDetail(id);
    });
  } catch (err) {
    out.innerHTML = `<div class="empty">${err.message}</div>`;
  }
}

// ============ إنشاء حوالة جديدة ============
async function loadCompanies() {
  const res = await ftc4Fetch('/api/companies');
  if (!res) return;
  companies = await res.json();
  document.getElementById('f-company').innerHTML = companies.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

document.getElementById('new-transfer-btn').addEventListener('click', async () => {
  if (!companies.length) await loadCompanies();
  document.getElementById('form-panel').classList.add('show');
  document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('groups').innerHTML = '';
  addGroup();
});

document.getElementById('cancel-btn').addEventListener('click', () => document.getElementById('form-panel').classList.remove('show'));

function addGroup() {
  const el = document.createElement('div');
  el.className = 'group-row';
  el.innerHTML = `
    <input class="g-class" placeholder="${t('ct.classification')}">
    <input class="g-count" type="number" min="1" value="1">
    <input class="g-course" type="number" step="0.01" min="0" value="0">
    <input class="g-bag" type="number" step="0.01" min="0" value="0">
    <button class="row-remove" type="button">×</button>`;
  el.querySelector('.row-remove').addEventListener('click', () => el.remove());
  document.getElementById('groups').appendChild(el);
}
document.getElementById('add-group-btn').addEventListener('click', addGroup);

document.getElementById('save-transfer-btn').addEventListener('click', async () => {
  const groups = [...document.querySelectorAll('#groups .group-row')].map(r => ({
    classification: r.querySelector('.g-class').value.trim(),
    trainee_count: parseInt(r.querySelector('.g-count').value) || 0,
    course_price: parseFloat(r.querySelector('.g-course').value) || 0,
    bag_price: parseFloat(r.querySelector('.g-bag').value) || 0,
  })).filter(g => g.classification && g.trainee_count > 0);

  try {
    if (!document.getElementById('f-company').value) throw new Error(t('ct.company') + '?');
    const res = await ftc4Fetch('/api/company-transfers', {
      method: 'POST',
      body: JSON.stringify({
        company_id: document.getElementById('f-company').value,
        transfer_date: document.getElementById('f-date').value,
        destination: document.getElementById('f-dest').value,
        groups,
      }),
    });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    document.getElementById('form-panel').classList.remove('show');
    showNotice('تم إنشاء الحوالة', true);
    loadTransfers();
  } catch (err) {
    showNotice(err.message, false);
  }
});

(async function init() {
  await loadI18n(currentLang);
  applyI18n();
  await loadCompanies();
  loadTransfers();
})();
</script>
</body>
</html>
