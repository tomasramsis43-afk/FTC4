<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTC4 — Clients Hub</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f3f5; --sidebar:#182335; --sidebar-hover:#22304a; --panel:#ffffff; --line:#dde1e6;
    --text:#191c22; --text-dim:#6b7280; --primary:#2563a8; --primary-bg:#e5eef7;
    --success:#1f8a5f; --success-bg:#e4f3ec; --warning:#b7791f; --warning-bg:#faf1e0;
    --danger:#c0392b; --danger-bg:#fbe9e7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;display:flex;min-height:100vh;}
  [dir="ltr"] body{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',sans-serif;}

  .sidebar{width:216px;background:var(--sidebar);color:#cdd4e0;flex-shrink:0;padding:18px 0;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .sb-brand-mark{width:28px;height:28px;border-radius:5px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
  .sb-brand-text{font-size:13.5px;font-weight:600;color:#fff;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:12.5px;color:#b9c1d1;cursor:pointer;border-inline-end:2px solid transparent;}
  .sb-item.active{background:var(--sidebar-hover);color:#fff;border-inline-end:2px solid var(--primary);}

  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;}
  .lang-toggle span{padding:6px 12px;font-size:12px;}
  .lang-toggle span.active{background:var(--primary);color:#fff;}

  .content{padding:20px 24px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .page-title{font-size:16px;font-weight:600;}
  .btn{font-family:inherit;font-size:12px;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:start;font-weight:600;color:var(--text-dim);font-size:11px;padding:9px 14px;border-bottom:1px solid var(--line);background:#f7f8f9;white-space:nowrap;}
  tbody td{padding:9px 14px;border-bottom:1px solid var(--line);}
  tbody tr:nth-child(even){background:#fafbfc;}
  tbody tr:hover{background:var(--primary-bg);}
  .amount{font-family:'IBM Plex Mono',monospace;direction:ltr;display:block;text-align:end;}
  .badge{font-size:10.5px;padding:3px 8px;border-radius:3px;font-weight:600;display:inline-block;}
  .badge.paid{background:var(--success-bg);color:var(--success);}
  .badge.pending{background:var(--warning-bg);color:var(--warning);}
  .badge.overdue{background:var(--danger-bg);color:var(--danger);}
  .loading, .empty{padding:40px;text-align:center;color:var(--text-dim);}
  .footer{padding:10px 16px;font-size:11.5px;color:var(--text-dim);}
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-mark">FT</div>
      <div class="sb-brand-text">FTC4</div>
    </div>
    <div class="sb-item active" data-i18n="nav.clients">العملاء</div>
    <a class="sb-item" href="/vault.html" style="text-decoration:none;color:inherit" data-i18n="nav.vault">الخزينة</a>
    <a class="sb-item" href="/bagstock.html" style="text-decoration:none;color:inherit" data-i18n="bagstock.title">مخزون الحقائب</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div data-i18n="clients.title">سجل العملاء</div>
      <div class="lang-toggle" id="lang-toggle">
        <span data-lang="ar">عربي</span><span data-lang="en">EN</span>
      </div>
    </div>
    <div class="content">
      <div class="page-head">
        <div class="page-title" data-i18n="clients.title">سجل العملاء</div>
        <button class="btn primary" data-i18n="clients.new">عميل جديد</button>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th data-i18n="clients.name">اسم العميل</th>
              <th data-i18n="clients.type">النوع</th>
              <th data-i18n="clients.balanceDue">الرصيد المستحق</th>
              <th data-i18n="clients.lastActivity">آخر نشاط</th>
              <th data-i18n="clients.status">الحالة</th>
            </tr>
          </thead>
          <tbody id="clients-tbody">
            <tr><td colspan="5" class="loading">...جارِ التحميل</td></tr>
          </tbody>
        </table>
        <div class="footer" id="footer-count"></div>
      </div>
    </div>
  </div>

<script>
let i18n = {};
let currentLang = 'ar';

async function loadI18n(lang) {
  const res = await fetch(`/i18n/${lang}.json`);
  i18n = await res.json();
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[key]) el.textContent = i18n[key];
  });
  document.getElementById('html-root').setAttribute('lang', currentLang);
  document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('#lang-toggle span').forEach(s => {
    s.classList.toggle('active', s.dataset.lang === currentLang);
  });
}

function statusBadge(status) {
  const map = {
    paid: { key: 'clients.status.paid', cls: 'paid' },
    pending: { key: 'clients.status.pending', cls: 'pending' },
    overdue: { key: 'clients.status.overdue', cls: 'overdue' },
  };
  const s = map[status] || map.pending;
  return `<span class="badge ${s.cls}">${i18n[s.key] || status}</span>`;
}

async function loadClients() {
  const tbody = document.getElementById('clients-tbody');
  tbody.innerHTML = `<tr><td colspan="5" class="loading">...</td></tr>`;
  try {
    const res = await fetch('/api/clients?pageSize=50');
    const { data, total } = await res.json();
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">لا يوجد عملاء</td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(c => `
      <tr>
        <td>${c.name}</td>
        <td>${i18n['clients.type.' + c.client_type] || c.client_type}</td>
        <td class="amount">${Number(c.remaining).toLocaleString('en-US', {minimumFractionDigits:2})}</td>
        <td class="amount">${new Date(c.registration_date).toISOString().slice(0,10)}</td>
        <td>${statusBadge(c.status)}</td>
      </tr>
    `).join('');
    document.getElementById('footer-count').textContent = `${data.length} / ${total}`;
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">خطأ في التحميل: ${err.message}</td></tr>`;
  }
}

document.getElementById('lang-toggle').addEventListener('click', async (e) => {
  const lang = e.target.dataset.lang;
  if (!lang || lang === currentLang) return;
  currentLang = lang;
  await loadI18n(lang);
  applyI18n();
  loadClients(); // إعادة رسم الجدول بلغة النظام الجديدة (بيانات العميل نفسها متتغيرش زي ما اتفقنا)
});

(async function init() {
  await loadI18n(currentLang);
  applyI18n();
  await loadClients();
})();
</script>
</body>
</html>
