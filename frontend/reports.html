<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTC4 — Reports</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f3f5; --sidebar:#182335; --sidebar-hover:#22304a; --panel:#ffffff; --line:#dde1e6;
    --text:#191c22; --text-dim:#6b7280; --primary:#2563a8; --primary-bg:#e5eef7;
    --success:#1f8a5f; --success-bg:#e4f3ec; --warning:#b7791f; --warning-bg:#faf1e0;
    --danger:#c0392b; --danger-bg:#fbe9e7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;display:flex;min-height:100vh;}
  [dir="ltr"] body{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',sans-serif;}

  .sidebar{width:216px;background:var(--sidebar);color:#cdd4e0;flex-shrink:0;padding:18px 0;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .sb-brand-mark{width:28px;height:28px;border-radius:5px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
  .sb-brand-text{font-size:13.5px;font-weight:600;color:#fff;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:12.5px;color:#b9c1d1;cursor:pointer;border-inline-end:2px solid transparent;text-decoration:none;}
  .sb-item.active{background:var(--sidebar-hover);color:#fff;border-inline-end:2px solid var(--primary);}

  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;}
  .lang-toggle span{padding:6px 12px;font-size:12px;}
  .lang-toggle span.active{background:var(--primary);color:#fff;}
  .btn-logout{font-family:inherit;font-size:12px;border-radius:4px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .btn-logout:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}

  .content{padding:20px 24px;}
  .page-title{font-size:16px;font-weight:600;margin-bottom:16px;}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{font-family:inherit;font-size:12px;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

  .filter-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;}
  .filter-bar label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:4px;font-weight:600;}
  .filter-bar input{border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;}
  .btn{font-family:inherit;font-size:12px;border-radius:4px;padding:8px 16px;cursor:pointer;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:600;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px;}
  .card-title{padding:12px 16px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);background:#f7f8f9;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:start;font-weight:600;color:var(--text-dim);font-size:11px;padding:9px 14px;border-bottom:1px solid var(--line);background:#f7f8f9;white-space:nowrap;}
  tbody td{padding:9px 14px;border-bottom:1px solid var(--line);}
  tbody tr:nth-child(even){background:#fafbfc;}
  tr.total-row td{font-weight:700;background:var(--primary-bg);}
  .amount{font-family:'IBM Plex Mono',monospace;direction:ltr;display:block;text-align:end;}
  .neg{color:var(--danger);}
  .pos{color:var(--success);}
  .loading,.empty{padding:40px;text-align:center;color:var(--text-dim);}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px;}
  .kpi-card{background:var(--panel);padding:13px 16px;}
  .kpi-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .kpi-value{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;direction:ltr;text-align:right;}
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-mark">FT</div>
      <div class="sb-brand-text">FTC4</div>
    </div>
    <a class="sb-item" href="/index.html" data-i18n="nav.clients">العملاء</a>
    <a class="sb-item" href="/vault.html" data-i18n="nav.vault">الخزينة</a>
    <a class="sb-item" href="/bagstock.html" data-i18n="bagstock.title">مخزون الحقائب</a>
    <a class="sb-item" href="/invoices.html" data-i18n="invoices.title">سجل الفواتير</a>
    <a class="sb-item" href="/purchases.html" data-i18n="purchases.title">المشتريات</a>
    <a class="sb-item" href="/manual-sales.html" data-i18n="nav.manualSales">المبيعات اليدوية</a>
    <a class="sb-item" href="/company-transfers.html" data-i18n="nav.companyTransfers">حوالات الشركات</a>
    <a class="sb-item active" href="/reports.html" data-i18n="nav.reports">التقارير</a>
    <a class="sb-item" href="/ledger.html" data-i18n="nav.ledger">الحسابات والقيود</a>
    <a class="sb-item" href="/users.html" data-i18n="nav.users">المستخدمون</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div data-i18n="reports.title">التقارير المالية</div>
      <div class="topbar-left">
        <div class="lang-toggle" id="lang-toggle"><span data-lang="ar">عربي</span><span data-lang="en">EN</span></div>
        <button class="btn-logout" id="logout-btn" data-i18n="auth.logout">تسجيل الخروج</button>
      </div>
    </div>

    <div class="content">
      <div class="page-title" data-i18n="reports.title">التقارير المالية</div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="income" data-i18n="reports.income">قائمة الدخل</button>
        <button class="tab" data-tab="balanceSheet" data-i18n="reports.balanceSheet">الميزانية العمومية</button>
        <button class="tab" data-tab="cashFlow" data-i18n="reports.cashFlow">التدفقات النقدية</button>
        <button class="tab" data-tab="aging" data-i18n="reports.aging">أعمار الذمم</button>
        <button class="tab" data-tab="vat" data-i18n="reports.vat">إقرار الضريبة</button>
        <button class="tab" data-tab="trialBalance" data-i18n="reports.trialBalance">ميزان المراجعة</button>
        <button class="tab" data-tab="zakat" data-i18n="reports.zakat">الزكاة (تقديري)</button>
      </div>

      <div class="filter-bar" id="filter-bar">
        <div><label data-i18n="reports.from">من</label><input type="date" id="f-from"></div>
        <div><label data-i18n="reports.to">إلى</label><input type="date" id="f-to"></div>
        <div style="display:none"><label data-i18n="reports.asOf">حتى تاريخ</label><input type="date" id="f-asof"></div>
        <div style="display:none"><label data-i18n="reports.year">السنة</label><input type="number" id="f-year" value=""></div>
        <button class="btn" id="run-btn" data-i18n="reports.generate">عرض التقرير</button>
      </div>

      <div id="output"></div>
    </div>
  </div>

<script>
let i18n = {};
let currentLang = localStorage.getItem('ftc4_lang') || 'ar';
let activeTab = 'income';

const token = localStorage.getItem('ftc4_token');
if (!token) location.replace('/login.html');

async function ftc4Fetch(url, opts = {}) {
  const headers = new Headers(opts.headers || {});
  headers.set('Authorization', 'Bearer ' + token);
  if (opts.body) headers.set('Content-Type', 'application/json');
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401) { localStorage.removeItem('ftc4_token'); localStorage.removeItem('ftc4_user'); location.replace('/login.html'); return null; }
  return res;
}

async function loadI18n(lang) { const r = await fetch(`/i18n/${lang}.json`); i18n = await r.json(); }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (i18n[k]) el.textContent = i18n[k]; });
  document.getElementById('html-root').setAttribute('lang', currentLang);
  document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('#lang-toggle span').forEach(s => s.classList.toggle('active', s.dataset.lang === currentLang));
}
function t(key) { return i18n[key] || key; }
function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2 }); }
function money(n) {
  const v = Number(n || 0);
  return `<span class="amount ${v < 0 ? 'neg' : ''}">${v.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>`;
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('ftc4_token'); localStorage.removeItem('ftc4_user'); location.replace('/login.html');
});
document.getElementById('lang-toggle').addEventListener('click', async (e) => {
  const lang = e.target.dataset.lang;
  if (!lang || lang === currentLang) return;
  currentLang = lang; localStorage.setItem('ftc4_lang', lang);
  await loadI18n(lang); applyI18n(); run();
});

const tabs = document.getElementById('tabs');
tabs.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeTab = tab.dataset.tab;
  tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === tab));
  const isAsOf = activeTab === 'balanceSheet' || activeTab === 'aging' || activeTab === 'trialBalance';
  document.getElementById('f-asof').parentElement.style.display = isAsOf ? '' : 'none';
  const isYear = activeTab === 'zakat';
  document.getElementById('f-year').parentElement.style.display = isYear ? '' : 'none';
  run();
});

document.getElementById('run-btn').addEventListener('click', run);

function rangeParams() {
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const asOf = document.getElementById('f-asof').value;
  const year = document.getElementById('f-year').value;
  const q = new URLSearchParams();
  if (from) q.set('from', from);
  if (to) q.set('to', to);
  if (asOf) q.set('asOf', asOf);
  if (year) q.set('year', year);
  return q;
}

async function run() {
  const out = document.getElementById('output');
  out.innerHTML = `<div class="loading">...</div>`;
  try {
    let res;
    const q = rangeParams();
    if (activeTab === 'income') {
      res = await ftc4Fetch('/api/reports/income-statement?' + q);
      renderIncome(await res.json());
    } else if (activeTab === 'balanceSheet') {
      res = await ftc4Fetch('/api/reports/balance-sheet?' + q);
      renderBalanceSheet(await res.json());
    } else if (activeTab === 'cashFlow') {
      res = await ftc4Fetch('/api/reports/cash-flow?' + q);
      renderCashFlow(await res.json());
    } else if (activeTab === 'aging') {
      const ar = await (await ftc4Fetch('/api/reports/ar-aging?' + q)).json();
      const ap = await (await ftc4Fetch('/api/reports/ap-aging?' + q)).json();
      renderAging(ar, ap);
    } else if (activeTab === 'vat') {
      res = await ftc4Fetch('/api/reports/vat?' + q);
      renderVat(await res.json());
    } else if (activeTab === 'trialBalance') {
      res = await ftc4Fetch('/api/reports/trial-balance?' + q);
      renderTrialBalance(await res.json());
    } else if (activeTab === 'zakat') {
      res = await ftc4Fetch('/api/reports/zakat?' + q);
      renderZakat(await res.json());
    }
  } catch (err) {
    out.innerHTML = `<div class="empty">${err.message}</div>`;
  }
}

function tableCard(title, headers, rowsHtml) {
  return `
    <div class="card">
      <div class="card-title">${title}</div>
      <table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rowsHtml || `<tr><td colspan="${headers.length}" class="empty">—</td></tr>`}</tbody>
    </div>`;
}

function renderIncome(d) {
  const out = document.getElementById('output');
  const revRows = Object.entries(d.revenueBreakdown)
    .map(([k, v]) => `<tr><td>${k}</td>${money(v)}</tr>`).join('');
  const expRows = d.expenseBreakdown
    .map(e => `<tr><td>${e.category}</td>${money(e.total)}</tr>`).join('');

  out.innerHTML = `
    <div class="kpi">
      <div class="kpi-card"><div class="kpi-label">${t('reports.grossRevenue')}</div><div class="kpi-value">${fmt(d.grossRevenue)}</div></div>
      <div class="kpi-card"><div class="kpi-label">${t('reports.netRevenue')}</div><div class="kpi-value">${fmt(d.netRevenue)}</div></div>
      <div class="kpi-card"><div class="kpi-label">${t('reports.totalExpense')}</div><div class="kpi-value">${fmt(d.totalExpense)}</div></div>
      <div class="kpi-card"><div class="kpi-label">${t('reports.netIncome')}</div><div class="kpi-value">${fmt(d.netIncome)}</div></div>
    </div>
    ${tableCard(t('reports.expenseBreakdown'), [t('reports.category'), t('reports.amount')], expRows)}
    <div class="card">
      <table>
        <tbody>
          <tr><td>${t('reports.grossRevenue')}</td>${money(d.grossRevenue)}</tr>
          <tr><td>${t('reports.salesReturns')}</td>${money(-d.salesReturns)}</tr>
          <tr><td>${t('reports.depreciation')}</td>${money(d.depreciation)}</tr>
          <tr><td>${t('reports.accrued')}</td>${money(d.accrued)}</tr>
          <tr><td>${t('reports.adjustments')}</td>${money(d.adjustments)}</tr>
          <tr class="total-row"><td>${t('reports.netIncome')}</td>${money(d.netIncome)}</tr>
        </tbody>
      </table>
    </div>`;
}

function renderBalanceSheet(d) {
  const out = document.getElementById('output');
  const rows = [
    ['reports.cash', d.cash], ['reports.bank', d.bank], ['reports.network', d.network],
    ['reports.receivables', d.receivables], ['reports.bagInventory', d.bagInventory],
    ['reports.fixedAssets', d.fixedAssetsNet], ['reports.bagCustody', d.bagCustodyAsset],
  ];
  const assetRows = rows.filter(r => r[1] !== 0 || r[0] === 'reports.receivables' || r[0] === 'reports.cash')
    .map(([k, v]) => `<tr><td>${t(k)}</td>${money(v)}</tr>`).join('');

  const liabRows = [
    ['reports.bagCustody', d.bagCustodyLiability], ['reports.loans', d.loans],
    ['reports.accruedLiability', d.accrued], ['reports.otherLiab', d.otherLiab],
  ].filter(r => r[1] !== 0).map(([k, v]) => `<tr><td>${t(k)}</td>${money(v)}</tr>`).join('');

  const equityRows = [
    ['reports.ownerCapital', d.ownerCapital], ['reports.retainedEarnings', d.retainedEarnings],
  ].filter(r => r[1] !== 0).map(([k, v]) => `<tr><td>${t(k)}</td>${money(v)}</tr>`).join('');

  out.innerHTML = `
    ${tableCard(t('reports.totalAssets') + ' — ' + fmt(d.totalAssets), [t('ledger.account'), t('reports.amount')],
      assetRows + `<tr class="total-row"><td>${t('reports.totalAssets')}</td>${money(d.totalAssets)}</tr>`)}
    ${tableCard(t('reports.totalLiabilities') + ' — ' + fmt(d.totalLiabilities), [t('ledger.account'), t('reports.amount')],
      liabRows + `<tr class="total-row"><td>${t('reports.totalLiabilities')}</td>${money(d.totalLiabilities)}</tr>`)}
    ${tableCard(t('reports.totalEquity') + ' — ' + fmt(d.totalEquity), [t('ledger.account'), t('reports.amount')],
      equityRows + `<tr class="total-row"><td>${t('reports.totalEquity')}</td>${money(d.totalEquity)}</tr>`)}`;
}

function renderCashFlow(d) {
  const out = document.getElementById('output');
  const o = d.operating, i = d.investing, f = d.financing;
  const bucketRow = (label, v) => `<tr><td>${label}</td>${money(v)}</tr>`;
  out.innerHTML = `
    <div class="kpi">
      <div class="kpi-card"><div class="kpi-label">${t('reports.beginCash')}</div><div class="kpi-value">${fmt(d.beginCash)}</div></div>
      <div class="kpi-card"><div class="kpi-label">${t('reports.netChange')}</div><div class="kpi-value">${fmt(d.netChange)}</div></div>
      <div class="kpi-card"><div class="kpi-label">${t('reports.endCash')}</div><div class="kpi-value">${fmt(d.endCash)}</div></div>
      <div class="kpi-card"><div class="kpi-label">${t('reports.reconciled')}</div><div class="kpi-value">${t(d.reconciled ? 'reports.yes' : 'reports.no')}</div></div>
    </div>
    ${tableCard(t('reports.netOperating'), [t('reports.category'), t('reports.amount')],
      bucketRow(t('reports.opIn'), o.in) + bucketRow(t('reports.opReturns'), -o.returns) + bucketRow(t('reports.opOut'), -o.out) +
      `<tr class="total-row"><td>${t('reports.netOperating')}</td>${money(o.net)}</tr>`)}
    ${tableCard(t('reports.netInvesting'), [t('reports.category'), t('reports.amount')],
      bucketRow(t('reports.netInvesting'), i.net))}
    ${tableCard(t('reports.netFinancing'), [t('reports.category'), t('reports.amount')],
      bucketRow(t('reports.netFinancing'), f.net))}`;
}

function renderAging(ar, ap) {
  const out = document.getElementById('output');
  const bucketNames = ['0-30', '31-60', '61-90', '90+'];
  const bucketLabel = b => t('reports.bucket' + (b === '0-30' ? 0 : b === '31-60' ? 1 : b === '61-90' ? 2 : 3));
  const arBucketRows = bucketNames.map(b => `<tr><td>${bucketLabel(b)}</td>${money(ar.buckets[b])}</tr>`).join('');
  const apBucketRows = bucketNames.map(b => `<tr><td>${bucketLabel(b)}</td>${money(ap.buckets[b])}</tr>`).join('');
  const arClients = ar.clients.map(c => `<tr><td>${c.name}</td><td>${c.days}</td>${money(c.remaining)}<td>${bucketLabel(c.bucket)}</td></tr>`).join('');
  const apInvoices = ap.invoices.map(c => `<tr><td>${c.invoiceNo || c.id.slice(0, 8)}</td><td>${c.days}</td>${money(c.total)}<td>${bucketLabel(c.bucket)}</td></tr>`).join('');
  out.innerHTML = `
    ${tableCard(t('reports.receivables') + ' (AR)', [t('reports.bucket'), t('reports.amount')], arBucketRows)}
    ${tableCard(t('reports.purchases') + ' (AP)', [t('reports.bucket'), t('reports.amount')], apBucketRows)}
    ${tableCard(t('reports.client') + ' (AR)', [t('reports.client'), t('reports.days'), t('reports.amount'), t('reports.bucket')], arClients)}
    ${tableCard(t('reports.invoices') + ' (AP)', [t('reports.invoice'), t('reports.days'), t('reports.amount'), t('reports.bucket')], apInvoices)}`;
}

function renderVat(d) {
  const out = document.getElementById('output');
  const netVatLabel = d.netVat >= 0 ? t('reports.vatPayable') : t('reports.vatCredit');
  out.innerHTML = `
    <div class="kpi">
      <div class="kpi-card"><div class="kpi-label">${t('reports.outputVat')}</div><div class="kpi-value">${fmt(d.outputVat)}</div></div>
      <div class="kpi-card"><div class="kpi-label">${t('reports.inputVat')}</div><div class="kpi-value">${fmt(d.purchases.inputVat)}</div></div>
      <div class="kpi-card"><div class="kpi-label">${netVatLabel}</div><div class="kpi-value">${fmt(Math.abs(d.netVat))}</div></div>
    </div>
    ${tableCard(t('reports.sales'), [t('reports.category'), t('reports.amount')],
      `<tr><td>${t('reports.sales')} (${t('reports.amount')})</td>${money(d.sales.gross)}</tr>
       <tr><td>${t('reports.sales')} (${t('reports.netVat')})</td>${money(d.sales.salesNet)}</tr>
       <tr><td>${t('reports.outputVat')}</td>${money(d.outputVat)}</tr>`)}
    ${tableCard(t('reports.returns'), [t('reports.category'), t('reports.amount')],
      `<tr><td>${t('reports.returns')} (${t('reports.amount')})</td>${money(d.returns.gross)}</tr>
       <tr><td>${t('reports.returns')} (${t('reports.netVat')})</td>${money(d.returns.vat)}</tr>`)}
    ${tableCard(t('reports.purchases'), [t('reports.category'), t('reports.amount')],
      `<tr><td>${t('reports.purchases')} (${t('reports.amount')})</td>${money(d.purchases.gross)}</tr>
       <tr><td>${t('reports.purchases')} (${t('reports.inputVat')})</td>${money(d.purchases.inputVat)}</tr>
       <tr><td>${t('reports.purchases')} (${t('reports.netVat')})</td>${money(d.purchases.purchasesNet)}</tr>`)}
    <div class="card"><table><tbody>
      <tr class="total-row"><td>${netVatLabel}</td>${money(d.netVat)}</tr>
    </tbody></table></div>`;
}

function renderTrialBalance(d) {
  const out = document.getElementById('output');
  const rows = d.accounts.map(a => `
    <tr>
      <td class="code">${a.code}</td>
      <td>${a.name}</td>
      <td>${t('ledger.type.' + a.accountType)}</td>
      ${money(a.debit)}
      ${money(a.credit)}
      ${money(a.balance)}
    </tr>`).join('');
  out.innerHTML = `
    <div class="kpi">
      <div class="kpi-card"><div class="kpi-label">${t('reports.balanced')}</div><div class="kpi-value">${t(d.balanced ? 'reports.yes' : 'reports.no')}</div></div>
    </div>
    ${tableCard(t('reports.trialBalance'), [t('ledger.code'), t('ledger.account'), t('ledger.type'), t('ledger.debit'), t('ledger.credit'), t('ledger.balance')],
      rows + `<tr class="total-row">
        <td></td><td></td><td></td>${money(d.totalDebit)}${money(d.totalCredit)}<td></td>
      </tr>`)}`;
}

function renderZakat(d) {
  const out = document.getElementById('output');
  const pct = (d.rate * 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
  out.innerHTML = `
    <div class="kpi">
      <div class="kpi-card"><div class="kpi-label">${t('reports.year')}</div><div class="kpi-value">${d.year}</div></div>
      <div class="kpi-card"><div class="kpi-label">${t('reports.zakatDue')}</div><div class="kpi-value">${fmt(d.zakatDue)}</div></div>
    </div>
    ${tableCard(t('reports.zakat'), [t('reports.category'), t('reports.amount')],
      `<tr><td>${t('reports.equity')}</td>${money(d.equity)}</tr>
       <tr><td>${t('reports.longTermLoans')}</td>${money(d.longTermLoans)}</tr>
       <tr><td>${t('reports.fixedAssets')}</td>${money(-d.fixedAssetsNet)}</tr>
       <tr><td>${t('reports.manualAdditions')}</td>${money(d.manualAdditions)}</tr>
       <tr><td>${t('reports.manualDeductions')}</td>${money(-d.manualDeductions)}</tr>
       <tr class="total-row"><td>${t('reports.zakatBase')} (${pct}%)</td>${money(d.zakatBase)}</tr>
       <tr class="total-row"><td>${t('reports.zakatDue')}</td>${money(d.zakatDue)}</tr>`)}`;
}

(async function init() {
  const today = new Date().toISOString().slice(0, 10);
  const startOfYear = new Date().getFullYear() + '-01-01';
  document.getElementById('f-from').value = startOfYear;
  document.getElementById('f-to').value = today;
  document.getElementById('f-asof').value = today;
  document.getElementById('f-year').value = new Date().getFullYear();
  await loadI18n(currentLang);
  applyI18n();
  run();
})();
</script>
</body>
