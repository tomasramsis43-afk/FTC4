<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTC4 — Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f3f5; --sidebar:#182335; --sidebar-hover:#22304a; --panel:#ffffff; --line:#dde1e6;
    --text:#191c22; --text-dim:#6b7280; --primary:#2563a8; --primary-bg:#e5eef7;
    --success:#1f8a5f; --success-bg:#e4f3ec; --warning:#b7791f; --warning-bg:#faf1e0;
    --danger:#c0392b; --danger-bg:#fbe9e7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;display:flex;min-height:100vh;}
  [dir="ltr"] body{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',sans-serif;}

  .sidebar{width:216px;background:var(--sidebar);color:#cdd4e0;flex-shrink:0;padding:18px 0;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .sb-brand-mark{width:28px;height:28px;border-radius:5px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
  .sb-brand-text{font-size:13.5px;font-weight:600;color:#fff;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:12.5px;color:#b9c1d1;cursor:pointer;border-inline-end:2px solid transparent;text-decoration:none;}
  .sb-item.active{background:var(--sidebar-hover);color:#fff;border-inline-end:2px solid var(--primary);}

  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;}
  .lang-toggle span{padding:6px 12px;font-size:12px;}
  .lang-toggle span.active{background:var(--primary);color:#fff;}
  .btn-logout{font-family:inherit;font-size:12px;border-radius:4px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .btn-logout:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}

  .content{padding:20px 24px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .page-title{font-size:16px;font-weight:600;}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .tab{font-family:inherit;font-size:12px;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .btn{font-family:inherit;font-size:12px;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px;}
  .card-title{padding:12px 16px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);background:#f7f8f9;display:flex;justify-content:space-between;align-items:center;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:start;font-weight:600;color:var(--text-dim);font-size:11px;padding:9px 14px;border-bottom:1px solid var(--line);background:#f7f8f9;white-space:nowrap;}
  tbody td{padding:9px 14px;border-bottom:1px solid var(--line);}
  tbody tr:nth-child(even){background:#fafbfc;}
  .amount{font-family:'IBM Plex Mono',monospace;direction:ltr;display:block;text-align:end;}
  .badge{font-size:10.5px;padding:3px 8px;border-radius:3px;font-weight:600;display:inline-block;}
  .badge.auto{background:var(--primary-bg);color:var(--primary);}
  .badge.manual{background:var(--warning-bg);color:var(--warning);}
  .loading,.empty{padding:40px;text-align:center;color:var(--text-dim);}
  .notice{display:none;padding:9px 12px;border-radius:4px;font-size:12px;margin-bottom:14px;}
  .notice.show{display:block;}
  .notice.error{background:var(--danger-bg);color:var(--danger);}
  .notice.ok{background:var(--success-bg);color:var(--success);}

  .form-panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:18px;}
  .form-panel.show{display:block;}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary);}
  .line-row{display:grid;grid-template-columns:1fr 120px 120px 34px;gap:10px;margin-bottom:8px;align-items:center;}
  .line-row input,.line-row select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;}
  .line-remove{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:4px;background:var(--danger-bg);color:var(--danger);cursor:pointer;height:30px;}
  .line-remove:hover{border-color:var(--danger);}
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-mark">FT</div>
      <div class="sb-brand-text">FTC4</div>
    </div>
    <a class="sb-item" href="/index.html" data-i18n="nav.clients">العملاء</a>
    <a class="sb-item" href="/vault.html" data-i18n="nav.vault">الخزينة</a>
    <a class="sb-item" href="/bagstock.html" data-i18n="bagstock.title">مخزون الحقائب</a>
    <a class="sb-item" href="/invoices.html" data-i18n="invoices.title">سجل الفواتير</a>
    <a class="sb-item" href="/purchases.html" data-i18n="purchases.title">المشتريات</a>
    <a class="sb-item" href="/manual-sales.html" data-i18n="nav.manualSales">المبيعات اليدوية</a>
    <a class="sb-item" href="/company-transfers.html" data-i18n="nav.companyTransfers">حوالات الشركات</a>
    <a class="sb-item" href="/reports.html" data-i18n="nav.reports">التقارير</a>
    <a class="sb-item active" href="/ledger.html" data-i18n="nav.ledger">الحسابات والقيود</a>
    <a class="sb-item" href="/users.html" data-i18n="nav.users">المستخدمون</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div data-i18n="ledger.title">شجرة الحسابات واليومية</div>
      <div class="topbar-left">
        <div class="lang-toggle" id="lang-toggle"><span data-lang="ar">عربي</span><span data-lang="en">EN</span></div>
        <button class="btn-logout" id="logout-btn" data-i18n="auth.logout">تسجيل الخروج</button>
      </div>
    </div>

    <div class="content">
      <div class="page-head">
        <div class="page-title" data-i18n="ledger.title">شجرة الحسابات واليومية</div>
        <button class="btn primary" id="new-entry-btn" data-i18n="ledger.newEntry" style="display:none">قيد يدوي جديد</button>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="accounts" data-i18n="ledger.accounts">شجرة الحسابات</button>
        <button class="tab" data-tab="journal" data-i18n="ledger.journal">دفتر اليومية</button>
      </div>

      <div class="notice" id="notice"></div>

      <div class="form-panel" id="form-panel">
        <div class="form-row">
          <div class="field"><label data-i18n="ledger.date">التاريخ</label><input type="date" id="f-date"></div>
          <div class="field"><label data-i18n="ledger.entryKind">نوع القيد</label>
            <select id="f-kind">
              <option value="manual" data-i18n="ledger.entryKind.manual">يدوي</option>
              <option value="depreciation" data-i18n="ledger.entryKind.depreciation">إهلاك</option>
              <option value="accrued" data-i18n="ledger.entryKind.accrued">مصروف مستحق</option>
              <option value="fixed_asset" data-i18n="ledger.entryKind.fixed_asset">أصل ثابت</option>
              <option value="other_liability" data-i18n="ledger.entryKind.other_liability">التزام آخر</option>
              <option value="adjustment" data-i18n="ledger.entryKind.adjustment">تسوية</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-bottom:12px"><label data-i18n="ledger.description">الوصف</label><input id="f-desc"></div>
        <div class="line-row">
          <span>الحساب</span><span>مدين</span><span>دائن</span><span></span>
        </div>
        <div id="lines"></div>
        <button class="btn" id="add-line-btn" data-i18n="ledger.addLine">أضف سطر</button>
        <button class="btn primary" id="save-entry-btn" data-i18n="actions.save" style="margin-inline-start:8px">حفظ</button>
        <button class="btn" id="cancel-entry-btn" data-i18n="actions.cancel">إلغاء</button>
      </div>

      <div id="output"></div>
    </div>
  </div>

<script>
let i18n = {};
let currentLang = localStorage.getItem('ftc4_lang') || 'ar';
let activeTab = 'accounts';
let accounts = [];
const currentUser = JSON.parse(localStorage.getItem('ftc4_user') || '{}');

const token = localStorage.getItem('ftc4_token');
if (!token) location.replace('/login.html');

async function ftc4Fetch(url, opts = {}) {
  const headers = new Headers(opts.headers || {});
  headers.set('Authorization', 'Bearer ' + token);
  if (opts.body) headers.set('Content-Type', 'application/json');
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401) { localStorage.removeItem('ftc4_token'); localStorage.removeItem('ftc4_user'); location.replace('/login.html'); return null; }
  return res;
}

async function loadI18n(lang) { const r = await fetch(`/i18n/${lang}.json`); i18n = await r.json(); }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (i18n[k]) el.textContent = i18n[k]; });
  document.getElementById('html-root').setAttribute('lang', currentLang);
  document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('#lang-toggle span').forEach(s => s.classList.toggle('active', s.dataset.lang === currentLang));
}
function t(key) { return i18n[key] || key; }
function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2 }); }
function money(n) { return `<span class="amount">${fmt(n)}</span>`; }

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('ftc4_token'); localStorage.removeItem('ftc4_user'); location.replace('/login.html');
});
document.getElementById('lang-toggle').addEventListener('click', async (e) => {
  const lang = e.target.dataset.lang;
  if (!lang || lang === currentLang) return;
  currentLang = lang; localStorage.setItem('ftc4_lang', lang);
  await loadI18n(lang); applyI18n(); run();
});

const tabs = document.getElementById('tabs');
tabs.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeTab = tab.dataset.tab;
  tabs.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === tab));
  run();
});

function showNotice(msg, ok) {
  const el = document.getElementById('notice');
  el.textContent = msg;
  el.className = 'notice show ' + (ok ? 'ok' : 'error');
  setTimeout(() => el.classList.remove('show'), 4000);
}

async function run() {
  const out = document.getElementById('output');
  out.innerHTML = `<div class="loading">...</div>`;
  try {
    if (activeTab === 'accounts') renderAccounts(await (await ftc4Fetch('/api/accounts')).json());
    else renderJournal(await (await ftc4Fetch('/api/journal?pageSize=50')).json());
  } catch (err) {
    out.innerHTML = `<div class="empty">${err.message}</div>`;
  }
}

function renderAccounts(list) {
  accounts = list;
  const out = document.getElementById('output');
  const rows = list.map(a => `
    <tr>
      <td class="code" style="font-family:'IBM Plex Mono',monospace;direction:ltr">${a.code}</td>
      <td>${a.name}</td>
      <td><span class="badge manual">${t('ledger.type.' + a.account_type)}</span></td>
      <td>${money(a.debit)}</td>
      <td>${money(a.credit)}</td>
      <td class="amount">${fmt(a.balance)}</td>
    </tr>`).join('');
  out.innerHTML = `
    <div class="card"><table>
      <thead><tr>
        <th data-i18n="ledger.code">الكود</th><th data-i18n="ledger.account">الحساب</th>
        <th data-i18n="ledger.type">النوع</th><th data-i18n="ledger.debit">مدين</th>
        <th data-i18n="ledger.credit">دائن</th><th data-i18n="ledger.balance">الرصيد</th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="6" class="empty">—</td></tr>`}</tbody>
    </table></div>`;
}

function renderJournal(data) {
  const out = document.getElementById('output');
  if (!data.data.length) { out.innerHTML = `<div class="empty">—</div>`; return; }
  out.innerHTML = data.data.map(entry => {
    const kindLabel = t('ledger.entryKind.' + entry.entryKind);
    const badge = entry.isAuto
      ? `<span class="badge auto">${t('ledger.auto')} · ${kindLabel}</span>`
      : `<span class="badge manual">${t('ledger.manual')} · ${kindLabel}</span>`;
    const lines = entry.lines.map(l => `
      <tr>
        <td class="code" style="font-family:'IBM Plex Mono',monospace;direction:ltr">${l.accountCode}</td>
        <td>${l.accountName}</td>
        <td>${money(l.debit)}</td>
        <td>${money(l.credit)}</td>
      </tr>`).join('');
    return `
      <div class="card">
        <div class="card-title">
          <span>${entry.entryDate} — ${entry.description}</span>
          ${badge}
        </div>
        <table>
          <thead><tr>
            <th data-i18n="ledger.code">الكود</th><th data-i18n="ledger.account">الحساب</th>
            <th data-i18n="ledger.debit">مدين</th><th data-i18n="ledger.credit">دائن</th>
          </tr></thead>
          <tbody>${lines}</tbody>
        </table>
      </div>`;
  }).join('');
}

// ============ القيد اليدوي (admin فقط) ============
if (currentUser.role === 'admin') document.getElementById('new-entry-btn').style.display = '';

document.getElementById('new-entry-btn').addEventListener('click', () => {
  document.getElementById('form-panel').classList.add('show');
  if (!accounts.length) run();
  document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('f-desc').value = '';
  document.getElementById('lines').innerHTML = '';
  addLine(); addLine();
});

document.getElementById('cancel-entry-btn').addEventListener('click', () => {
  document.getElementById('form-panel').classList.remove('show');
});

function accountOptions(selected) {
  return accounts.map(a => `<option value="${a.code}" ${a.code === selected ? 'selected' : ''}>${a.code} — ${a.name}</option>`).join('');
}

function addLine() {
  const el = document.createElement('div');
  el.className = 'line-row';
  el.innerHTML = `
    <select class="line-account">${accountOptions()}</select>
    <input type="number" step="0.01" min="0" class="line-debit" placeholder="0">
    <input type="number" step="0.01" min="0" class="line-credit" placeholder="0">
    <button class="line-remove" type="button">×</button>`;
  el.querySelector('.line-remove').addEventListener('click', () => el.remove());
  document.getElementById('lines').appendChild(el);
}
document.getElementById('add-line-btn').addEventListener('click', addLine);

document.getElementById('save-entry-btn').addEventListener('click', async () => {
  const lines = [...document.querySelectorAll('#lines .line-row')].map(r => ({
    accountCode: r.querySelector('.line-account').value,
    debit: parseFloat(r.querySelector('.line-debit').value) || 0,
    credit: parseFloat(r.querySelector('.line-credit').value) || 0,
  })).filter(l => l.debit > 0 || l.credit > 0);

  try {
    const res = await ftc4Fetch('/api/journal', {
      method: 'POST',
      body: JSON.stringify({
        entryDate: document.getElementById('f-date').value,
        description: document.getElementById('f-desc').value.trim(),
        entryKind: document.getElementById('f-kind').value,
        lines,
      }),
    });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    document.getElementById('form-panel').classList.remove('show');
    showNotice('تم حفظ القيد', true);
    run();
  } catch (err) {
    showNotice(err.message, false);
  }
});

(async function init() {
  await loadI18n(currentLang);
  applyI18n();
  run();
})();
</script>
</body>
</html>
