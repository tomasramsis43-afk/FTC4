<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTC4 — Finance Vault</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f3f5; --sidebar:#182335; --sidebar-hover:#22304a; --panel:#ffffff; --line:#dde1e6;
    --text:#191c22; --text-dim:#6b7280; --primary:#2563a8; --primary-bg:#e5eef7;
    --success:#1f8a5f; --success-bg:#e4f3ec; --warning:#b7791f; --warning-bg:#faf1e0;
    --danger:#c0392b; --danger-bg:#fbe9e7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;font-size:13px;display:flex;min-height:100vh;}
  .sidebar{width:216px;background:var(--sidebar);color:#cdd4e0;flex-shrink:0;padding:18px 0;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .sb-brand-mark{width:28px;height:28px;border-radius:5px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;}
  .sb-brand-text{font-size:13.5px;font-weight:600;color:#fff;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:12.5px;color:#b9c1d1;cursor:pointer;border-inline-end:2px solid transparent;text-decoration:none;}
  .sb-item.active{background:var(--sidebar-hover);color:#fff;border-inline-end:2px solid var(--primary);}
  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;}
  .lang-toggle{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer;}
  .lang-toggle span{padding:6px 12px;font-size:12px;}
  .lang-toggle span.active{background:var(--primary);color:#fff;}
  .btn-logout{font-family:inherit;font-size:12px;border-radius:4px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .btn-logout:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
  .content{padding:20px 24px;}
  .page-title{font-size:16px;font-weight:600;margin-bottom:16px;}

  .balance-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px;}
  .balance-card{background:var(--panel);padding:13px 16px;cursor:pointer;}
  .balance-card.active{background:var(--primary-bg);}
  .balance-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .balance-value{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;direction:ltr;text-align:right;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:start;font-weight:600;color:var(--text-dim);font-size:11px;padding:9px 14px;border-bottom:1px solid var(--line);background:#f7f8f9;white-space:nowrap;}
  tbody td{padding:9px 14px;border-bottom:1px solid var(--line);}
  tbody tr:nth-child(even){background:#fafbfc;}
  .amount{font-family:'IBM Plex Mono',monospace;direction:ltr;display:block;text-align:end;}
  .badge{font-size:10.5px;padding:3px 8px;border-radius:3px;font-weight:600;display:inline-block;}
  .badge.in{background:var(--success-bg);color:var(--success);}
  .badge.out{background:var(--danger-bg);color:var(--danger);}
  .loading, .empty{padding:40px;text-align:center;color:var(--text-dim);}
  .footer{padding:10px 16px;font-size:11.5px;color:var(--text-dim);}
  .btn-delete{font-family:inherit;font-size:12px;border-radius:4px;padding:4px 9px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--danger);}
  .btn-delete:hover{background:var(--danger-bg);border-color:var(--danger);}
  .btn{font-family:inherit;font-size:12px;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .notice{display:none;padding:9px 12px;border-radius:4px;font-size:12px;margin-bottom:14px;}
  .notice.show{display:block;}
  .notice.error{background:var(--danger-bg);color:var(--danger);}
  .notice.ok{background:var(--success-bg);color:var(--success);}
  .form-panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:18px;}
  .form-panel.show{display:block;}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary);}
  .field.check{display:flex;align-items:center;gap:8px;padding-top:22px;}
  .field.check input{width:auto;}
  .field.check label{margin:0;cursor:pointer;}
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sb-brand"><div class="sb-brand-mark">FT</div><div class="sb-brand-text">FTC4</div></div>
    <a class="sb-item" href="/index.html" data-i18n="nav.clients">العملاء</a>
    <a class="sb-item active" href="/vault.html" data-i18n="nav.vault">الخزينة</a>
    <a class="sb-item" href="/bagstock.html" data-i18n="bagstock.title">مخزون الحقائب</a>
    <a class="sb-item" href="/invoices.html" data-i18n="invoices.title">سجل الفواتير</a>
    <a class="sb-item" href="/purchases.html" data-i18n="purchases.title">المشتريات</a>
    <a class="sb-item" href="/manual-sales.html" data-i18n="nav.manualSales">المبيعات اليدوية</a>
    <a class="sb-item" href="/company-transfers.html" data-i18n="nav.companyTransfers">حوالات الشركات</a>
    <a class="sb-item" href="/reports.html" data-i18n="nav.reports">التقارير</a>
    <a class="sb-item" href="/ledger.html" data-i18n="nav.ledger">الحسابات والقيود</a>
    <a class="sb-item" href="/users.html" data-i18n="nav.users">المستخدمون</a>
    <a class="sb-item" href="/settings.html" data-i18n="nav.settings">الإعدادات</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div data-i18n="vault.title">الخزينة</div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="lang-toggle" id="lang-toggle"><span data-lang="ar">عربي</span><span data-lang="en">EN</span></div>
        <button class="btn-logout" id="logout-btn" data-i18n="auth.logout">تسجيل الخروج</button>
      </div>
    </div>
    <div class="content">
      <div class="page-head">
        <div class="page-title" data-i18n="vault.title">الخزينة</div>
        <button class="btn primary" id="new-tx-btn" data-i18n="vault.new">حركة جديدة</button>
      </div>

      <div class="notice" id="notice"></div>

      <div class="form-panel" id="form-panel">
        <div class="form-row">
          <div class="field"><label data-i18n="vault.destination">الوجهة</label>
            <select id="f-dest">
              <option value="vault">vault</option><option value="bank">bank</option>
              <option value="network">network</option><option value="other">other</option>
            </select>
          </div>
          <div class="field"><label data-i18n="vault.type">النوع</label>
            <select id="f-type"><option value="in">in</option><option value="out">out</option></select>
          </div>
          <div class="field"><label data-i18n="vault.amount">المبلغ</label><input id="f-amount" type="number" step="0.01" min="0"></div>
          <div class="field"><label data-i18n="vault.date">التاريخ</label><input type="date" id="f-date"></div>
        </div>
        <div class="form-row">
          <div class="field"><label data-i18n="vault.category">التصنيف</label><input id="f-category"></div>
          <div class="field"><label data-i18n="vault.kind">نوع الحركة</label>
            <select id="f-kind">
              <option value="">operational</option>
              <option value="operational">operational</option>
              <option value="loan_in">loan_in</option>
              <option value="loan_out">loan_out</option>
              <option value="partner_drawing">partner_drawing</option>
              <option value="capital">capital</option>
              <option value="fixed_asset">fixed_asset</option>
            </select>
          </div>
          <div class="field"><label data-i18n="vault.client">العميل (اختياري)</label><select id="f-client"></select></div>
          <div class="field"><label data-i18n="vault.notes">ملاحظات</label><input id="f-notes"></div>
        </div>
        <div class="form-row">
          <div class="field check"><input type="checkbox" id="f-return"><label data-i18n="vault.isReturn">مردود مبيعات</label></div>
          <div class="field check"><input type="checkbox" id="f-settled" checked><label data-i18n="vault.settled">مُسوّاة (معتمدة)</label></div>
        </div>
        <button class="btn primary" id="save-tx-btn" data-i18n="actions.save">حفظ</button>
        <button class="btn" id="cancel-tx-btn" data-i18n="actions.cancel">إلغاء</button>
      </div>

      <div class="balance-strip" id="balance-strip"></div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th data-i18n="vault.seq">الرقم</th>
              <th data-i18n="vault.date">التاريخ</th>
              <th data-i18n="vault.category">التصنيف</th>
              <th data-i18n="vault.client">العميل</th>
              <th data-i18n="vault.amount">المبلغ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="vault-tbody"><tr><td colspan="6" class="loading">...</td></tr></tbody>
        </table>
        <div class="footer" id="footer-count"></div>
      </div>
    </div>
  </div>

<script>
let i18n = {};
let currentLang = localStorage.getItem('ftc4_lang') || 'ar';
let currentDest = null;
const DESTS = ['vault','bank','network','other'];

const ftc4Token = localStorage.getItem('ftc4_token');
if (!ftc4Token) location.replace('/login.html');

async function ftc4Fetch(url, opts = {}) {
  const headers = new Headers(opts.headers || {});
  headers.set('Authorization', 'Bearer ' + ftc4Token);
  if (opts.body) headers.set('Content-Type', 'application/json');
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401) {
    localStorage.removeItem('ftc4_token');
    localStorage.removeItem('ftc4_user');
    location.replace('/login.html');
    return null;
  }
  return res;
}

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('ftc4_token');
  localStorage.removeItem('ftc4_user');
  location.replace('/login.html');
});

async function loadI18n(lang){ const r = await fetch(`/i18n/${lang}.json`); i18n = await r.json(); }

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.getAttribute('data-i18n'); if(i18n[k]) el.textContent=i18n[k]; });
  document.getElementById('html-root').setAttribute('lang', currentLang);
  document.getElementById('html-root').setAttribute('dir', currentLang==='ar'?'rtl':'ltr');
  document.querySelectorAll('#lang-toggle span').forEach(s=>s.classList.toggle('active', s.dataset.lang===currentLang));
}

async function loadVault(){
  const tbody = document.getElementById('vault-tbody');
  tbody.innerHTML = `<tr><td colspan="6" class="loading">...</td></tr>`;
  const url = currentDest ? `/api/vault-transactions?destination=${currentDest}&pageSize=50` : `/api/vault-transactions?pageSize=50`;
  const res = await ftc4Fetch(url);
  const { data, total, balances } = await res.json();

  document.getElementById('balance-strip').innerHTML = DESTS.map(d => `
    <div class="balance-card ${d===currentDest?'active':''}" data-dest="${d}">
      <div class="balance-label">${i18n['vault.destination.'+d] || d}</div>
      <div class="balance-value">${Number(balances[d]).toLocaleString('en-US',{minimumFractionDigits:2})}</div>
    </div>
  `).join('');
  document.querySelectorAll('.balance-card').forEach(el => el.addEventListener('click', () => {
    currentDest = currentDest === el.dataset.dest ? null : el.dataset.dest;
    loadVault();
  }));

  if(!data.length){ tbody.innerHTML = `<tr><td colspan="6" class="empty">—</td></tr>`; return; }
  tbody.innerHTML = data.map(t => `
    <tr>
      <td>${t.seq} <span class="badge ${t.tx_type}">${i18n['vault.type.'+t.tx_type]||t.tx_type}</span></td>
      <td>${new Date(t.tx_date).toISOString().slice(0,10)}</td>
      <td>${t.category || '—'}</td>
      <td>${t.client_name || '—'}</td>
      <td class="amount">${Number(t.amount).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
      <td><button class="btn-logout btn-delete" data-del="${t.id}" data-seq="${t.seq}">✕</button></td>
    </tr>
  `).join('');
  tbody.querySelectorAll('.btn-delete').forEach(b => b.addEventListener('click', async () => {
    const reason = prompt(i18n['vault.deleteReason'] || 'سبب الحذف (إلزامي — يُسجَّل في سجل التدقيق)');
    if (reason === null) return;
    const msg = (i18n['vault.confirmDelete'] || 'حذف حركة #{{seq}}؟ لا يمكن التراجع (حذف منطقي مسجّل).').replace('{{seq}}', b.dataset.seq);
    if (!confirm(msg)) return;
    const r = await ftc4Fetch(`/api/vault-transactions/${b.dataset.del}`, { method: 'DELETE', body: JSON.stringify({ reason }) });
    if (!r) return;
    if (!r.ok) { const d = await r.json(); alert(d.error || 'فشل الحذف'); return; }
    loadVault();
  }));
  document.getElementById('footer-count').textContent = `${data.length} / ${total}`;
}

document.getElementById('lang-toggle').addEventListener('click', async (e)=>{
  const lang = e.target.dataset.lang;
  if(!lang || lang===currentLang) return;
  currentLang = lang;
  localStorage.setItem('ftc4_lang', lang);
  await loadI18n(lang); applyI18n(); loadVault();
});

// ============ حركة خزينة جديدة ============
function showNotice(msg, ok) {
  const el = document.getElementById('notice');
  el.textContent = msg;
  el.className = 'notice show ' + (ok ? 'ok' : 'error');
  setTimeout(() => el.classList.remove('show'), 4000);
}

async function loadClientOptions() {
  const res = await ftc4Fetch('/api/clients?pageSize=200');
  if (!res) return;
  const { data } = await res.json();
  document.getElementById('f-client').innerHTML = `<option value="">—</option>` +
    data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

document.getElementById('new-tx-btn').addEventListener('click', () => {
  document.getElementById('form-panel').classList.add('show');
  document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('f-amount').value = '';
  document.getElementById('f-return').checked = false;
  document.getElementById('f-settled').checked = true;
  document.getElementById('form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
document.getElementById('cancel-tx-btn').addEventListener('click', () => document.getElementById('form-panel').classList.remove('show'));

document.getElementById('save-tx-btn').addEventListener('click', async () => {
  const val = id => document.getElementById(id).value;
  const amount = parseFloat(val('f-amount')) || 0;
  const txDate = val('f-date');
  if (amount <= 0) { showNotice(i18n['vault.amountRequired'] || 'المبلغ مطلوب', false); return; }
  if (!txDate) { showNotice(i18n['vault.dateRequired'] || 'التاريخ مطلوب', false); return; }

  const body = {
    destination: val('f-dest'),
    tx_type: val('f-type'),
    amount,
    tx_date: txDate,
    category: val('f-category').trim() || null,
    transaction_kind: val('f-kind') || null,
    client_id: val('f-client') || null,
    is_return: document.getElementById('f-return').checked,
    settled: document.getElementById('f-settled').checked,
    notes: val('f-notes').trim() || null,
  };

  try {
    const res = await ftc4Fetch('/api/vault-transactions', { method: 'POST', body: JSON.stringify(body) });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'فشل الحفظ');
    document.getElementById('form-panel').classList.remove('show');
    showNotice(i18n['vault.saved'] || 'تم تسجيل الحركة', true);
    loadVault();
  } catch (err) {
    showNotice(err.message, false);
  }
});

(async function init(){ await loadI18n(currentLang); applyI18n(); await loadVault(); })();
</script>
</body>
</html>
